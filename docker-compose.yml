services:
  db:
    image: postgres:16-alpine
    container_name: restaurant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurant_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-restaurant_user} -d $${POSTGRES_DB:-restaurant_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurant_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-restaurant_user}:${POSTGRES_PASSWORD:-restaurant_secret_pass}@db:5432/${POSTGRES_DB:-restaurant_db}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-jwt_access_super_secret_key_12345_67890}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-jwt_refresh_super_secret_key_12345_67890}
      AES_SECRET_KEY: ${AES_SECRET_KEY:-aes_secret_key_super_secret_12345_67890}
      COOKIE_SECRET: ${COOKIE_SECRET:-cookie_super_secret_key_12345_67890}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      WEBSITE_URL: ${WEBSITE_URL:-http://localhost}
      ADMIN_NAME: ${ADMIN_NAME:-Admin User}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@restaurant.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      CORS_ORIGIN: "*"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restaurant_admin_frontend
    restart: unless-stopped
    depends_on:
      - backend

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: restaurant_website
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api
      PORT: 3000
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: restaurant_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - website

volumes:
  postgres_data:
  uploads_data:
